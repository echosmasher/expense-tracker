# Cloudflare sets CF-Connecting-IP to the real client address at its edge; that
# survives the hop through the tunnel to cloudflared even though $remote_addr
# here is just the cloudflared container. Falls back to $remote_addr for local/
# LAN access where the header isn't present (dev, direct docker network hits).
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Content-Security-Policy: style-src allows 'unsafe-inline' as a stated
    # trade-off — every component injects a <style> block. Scripts stay strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        # Overwrite rather than append: the API trusts exactly one proxy hop
        # (see app.ts `trust proxy: 1`) and expects a single real client IP,
        # not a chain it would have to pick apart.
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:3001/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
